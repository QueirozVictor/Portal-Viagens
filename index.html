/Portal-Viagens/image/disney/guardiansOfGalaxy.jpg\",\"name\":\"Guardians of Galaxy\"},{\"image\":\"/Portal-Viagens/image/disney/toyStoryLand.jpg\",\"name\":\"Toy Story Land\"}]},{\"id\":2,\"title\":\"Tokyo\",\"slug\":\"tokyo\",\"imagem\":\"/Portal-Viagens/image/tokyo/tokyoLogo.jpg\",\"value\":\"R$ 10.000\",\"destaque\":false,\"historia\":\"Tokyo, capital do Japão, teve origem como uma pequena vila de pescadores chamada Edo. No século XVII, tornou-se o centro político do país e, em 1868, passou a ser a capital imperial, recebendo o nome de Tóquio, que significa 'Capital do Leste'. Ao longo dos anos, a cidade superou grandes desafios, como terremotos e a Segunda Guerra Mundial, transformando-se em uma das metrópoles mais modernas e influentes do mundo. Hoje, Tóquio encanta visitantes ao combinar tecnologia de ponta, tradição milenar, templos históricos, bairros vibrantes e uma das culturas mais fascinantes do planeta.\",\"pontosTuristicos\":[{\"image\":\"/Portal-Viagens/image/tokyo/tokyoTower.jpg\",\"name\":\"Tokyo Tower\"},{\"image\":\"/Portal-Viagens/image/tokyo/shibuya.jpg\",\"name\":\"Shibuya\"},{\"image\":\"/Portal-Viagens/image/tokyo/sensoJi.jpg\",\"name\":\" Sensō-ji\"},{\"image\":\"/Portal-Viagens/image/tokyo/meijiShrine.jpg\",\"name\":\"Meiji Shrine\"}]},{\"id\":3,\"title\":\"Londres\",\"slug\":\"londres\",\"imagem\":\"/Portal-Viagens/image/londres/londresLogo.jpg\",\"value\":\"R$ 11.000\",\"destaque\":false,\"historia\":\"Fundada pelos romanos há quase 2 mil anos, Londres cresceu às margens do rio Tâmisa e se tornou uma das cidades mais influentes do mundo. Caminhar por suas ruas é viajar no tempo entre palácios reais, monumentos históricos e bairros cheios de cultura. Do majestoso Palácio de Buckingham ao icônico Big Ben, passando por museus, parques e mercados tradicionais, Londres encanta visitantes com sua mistura única de tradição, modernidade e diversidade.\",\"pontosTuristicos\":[{\"image\":\"/Portal-Viagens/image/londres/bigBen.jpeg\",\"name\":\"Big Ben\"},{\"image\":\"/Portal-Viagens/image/londres/londonTower.jpeg\",\"name\":\"London Tower\"},{\"image\":\"/Portal-Viagens/image/londres/palace.jpeg\",\"name\":\"Buckingham Palace\"},{\"image\":\"/Portal-Viagens/image/londres/londonEye.jpeg\",\"name\":\"London Eye\"}]},{\"id\":4,\"title\":\"Paris\",\"slug\":\"paris\",\"imagem\":\"/Portal-Viagens/image/paris/parisLogo.jpg\",\"value\":\"R$ 13.000\",\"destaque\":true,\"historia\":\"Conhecida como a Cidade Luz, Paris é a capital da França e um dos destinos mais visitados do mundo. Sua origem remonta a mais de dois mil anos, quando a região era habitada pela tribo celta dos Parisii, às margens do Rio Sena. Com o passar dos séculos, a cidade tornou-se um importante centro político, cultural e econômico da Europa. Ao longo de sua história, Paris foi palco de acontecimentos marcantes, como a Revolução Francesa, e viu nascer monumentos que hoje são símbolos mundiais, como a Torre Eiffel, a Catedral de Notre-Dame e o Museu do Louvre. Atualmente, a cidade encanta visitantes com sua arquitetura elegante, museus renomados, gastronomia, cafés tradicionais e atmosfera romântica. Passear por suas ruas é uma oportunidade de conhecer séculos de história, arte e cultura em um dos lugares mais fascinantes do mundo.\",\"pontosTuristicos\":[{\"image\":\"/Portal-Viagens/image/paris/arcDeTriomphe.jpg\",\"name\":\"Arc de Triomphe\"},{\"image\":\"/Portal-Viagens/image/paris/louvreMuseum.jpg\",\"name\":\"Louvre Museum\"},{\"image\":\"/Portal-Viagens/image/paris/eiffelTower.jpg\",\"name\":\"Eiffel Tower\"},{\"image\":\"/Portal-Viagens/image/paris/notreDame.jpg\",\"name\":\"Notre-Dame\"}]},{\"id\":5,\"title\":\"Singapura\",\"slug\":\"singapura\",\"imagem\":\"/Portal-Viagens/image/singapura/singapuraLogo.jpg\",\"value\":\"R$ 9.000\",\"destaque\":true,\"historia\":\"Singapura é uma cidade-estado localizada no Sudeste Asiático que se transformou, em poucas décadas, em um dos países mais modernos e desenvolvidos do mundo. Fundada como um importa
